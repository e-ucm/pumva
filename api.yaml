openapi: 3.0.3
info:
  title: PUMVA API
  description: |
    PUMVA API
    
    This API provides endpoints for managing games, users, technologies, trackers, versions, 
    permissions, languages, and teacher guides in an educational gaming platform.
    
    ## Features
    - User management with role-based access (admin, teacher, student)
    - Game management with versions and technologies
    - Permission system for game access control
    - Multi-language support for teacher guides
    - Technology and tracker management
    
  version: 1.0.0
  contact:
    name: PUMVA Development Team
    email: support@pumva.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.pumva.com
    description: Production server

paths:
  # User endpoints
  /users:
    get:
      tags:
        - Admins
        - Teachers
        - Users_table_databases
      summary: Get all users or filter by username
      description: Retrieve all users from the system or filter by username query parameter
      parameters:
        - name: username
          in: query
          description: Filter users by username
          required: false
          schema:
            type: string
            example: "john_doe"
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Admins
        - Teachers
        - Users_table_databases
      summary: Create a new user
      description: Create a new user in the system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartialUser'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{id}:
    delete:
      tags:
        - Admins
        - Teachers
        - Users_table_databases
      summary: Delete a user
      description: Delete a user by their ID
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            example: 1
      responses:
        '204':
          description: User deleted successfully
        '404':
