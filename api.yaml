            type: integer
            example: 1
        - name: languageId
          in: path
          required: true
          description: Language ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Complete permissions view
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuidePermission'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Health endpoint
  /health:
    get:
      tags:
        - Healths
      summary: Health check
      description: Check if the API is running and healthy
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
                    example: "1.0.0"

  # Views endpoints - Database view queries for complex data aggregations
  /views/games/user/{user_id}:
    get:
      tags:
        - Admins
        - Teachers
        - Views_databases
        - Games_databases
      summary: Get games for a specific user
      description: Retrieve games with user permissions using the v_complete_game_permissions view
      parameters:
        - name: user_id
          in: path
          required: true
          description: User ID to get games for
          schema:
            type: integer
            example: 123
      responses:
        '200':
          description: List of games with user permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompleteGamePermission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /views/games/public:
    get:
      tags:
        - Admins
        - Teachers
        - Views_databases
        - Games_databases
      summary: Get all public games
      description: Retrieve all public games using the v_public_games_permissions view
      responses:
        '200':
          description: List of public games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompleteGamePermission'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /views/guides/user/{user_id}/game/{game_id}:
    get:
      tags:
        - Admins
        - Teachers
        - Views_databases
        - Teacher Guides_databases
      summary: Get teacher guides for a user and game
      description: Retrieve teacher guides with permissions using the v_game_guide_url_permissions view
      parameters:
        - name: user_id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            example: 123
        - name: game_id
          in: path
          required: true
          description: Game ID
          schema:
            type: integer
            example: 456
      responses:
        '200':
          description: List of teacher guides with permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompleteGameGuidePermission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /views/users/username/{username}:
    get:
      tags:
        - Admins
        - Teachers
        - Views_databases
        - Users_databases
      summary: Get user by username
      description: Retrieve user information by username using database view
      parameters:
        - name: username
          in: path
          required: true
          description: Username to search for
          schema:
            type: string
            example: "john_doe"
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    User:
      type: object
      properties:
        user_id:
          type: integer
          description: Unique identifier for the user
          example: 1
        username:
          type: string
          description: Unique username
          example: "john_doe"
        email:
          type: string
          format: email
          description: User's email address
          example: "john@example.com"
        role:
          type: string
          description: User's role in the system
          enum: ["admin", "teacher", "student"]
          example: "teacher"
        createdAt:
          type: string
          format: date-time
          description: When the user was created
        updatedAt:
          type: string
          format: date-time
          description: When the user was last updated

    PartialUser:
      type: object
      properties:
        username:
          type: string
          description: Unique username
          example: "john_doe"
        email:
          type: string
          format: email
          description: User's email address
          example: "john@example.com"
        role:
          type: string
          description: User's role in the system
          enum: ["admin", "teacher", "student"]
          example: "teacher"

    Game:
      type: object
      properties:
        game_id:
          type: integer
          description: Unique identifier for the game
          example: 1
        name:
          type: string
          description: Display name of the game
          example: "Educational Math Game"
        description:
          type: string
          description: Detailed description of the game
          example: "An interactive game for learning mathematics"
        public:
          type: boolean
          description: Whether the game is publicly accessible
          example: true
        actual:
          type: integer
          nullable: true
          description: Current version ID that is set as actual
          example: 5
        owner_id:
          type: integer
          description: ID of the user who owns the game
          example: 1
        type:
          type: string
          description: Type of the game
          enum: ["WEB", "DESKTOP", "MOBILE"]
          example: "WEB"
        technology_id:
          type: integer
          description: ID of the technology used by the game
          example: 1
        tracker_id:
          type: integer
          description: ID of the tracker associated with the game
          example: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PartialGame:
      type: object
      properties:
        name:
          type: string
          description: Display name of the game
          example: "Educational Math Game"
        description:
          type: string
          description: Detailed description of the game
          example: "An interactive game for learning mathematics"
        public:
          type: boolean
          description: Whether the game is publicly accessible
          example: true
        owner_id:
          type: integer
          description: ID of the user who owns the game
          example: 1
        type:
          type: string
          description: Type of the game
          enum: ["WEB", "DESKTOP", "MOBILE"]
          example: "WEB"
        technology_id:
          type: integer
          description: ID of the technology used by the game
          example: 1
        tracker_id:
          type: integer
          description: ID of the tracker associated with the game
          example: 1

    GameVersion:
      type: object
      properties:
        version_id:
          type: integer
          description: Unique identifier for the version
          example: 1
        game_id:
          type: integer
          description: ID of the associated game
          example: 1
        version:
          type: string
          description: Version string/number
          example: "1.0.0"
        external_url:
          type: string
          format: uri
          description: External URL where this version is hosted
          example: "https://example.com/game/v1.0.0"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PartialGameVersion:
      type: object
      properties:
        game_id:
          type: integer
          description: ID of the associated game
          example: 1
        version:
          type: string
          description: Version string/number
          example: "1.0.0"
        external_url:
          type: string
          format: uri
          description: External URL where this version is hosted
          example: "https://example.com/game/v1.0.0"

    GamePermission:
      type: object
      properties:
        permission_id:
          type: integer
          description: Unique identifier for the permission
          example: 1
        user_id:
          type: integer
          description: ID of the user
          example: 1
        game_id:
          type: integer
          description: ID of the game
          example: 1
        permissions:
          type: string
          description: Permission level granted
          enum: ["read", "write", "admin"]
          example: "read"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PartialGamePermission:
      type: object
      properties:
        user_id:
          type: integer
          description: ID of the user
          example: 1
        game_id:
          type: integer
          description: ID of the game
          example: 1
        permissions:
          type: string
          description: Permission level to grant
          enum: ["read", "write", "admin"]
          example: "read"

    Technology:
      type: object
      properties:
        technology_id:
          type: integer
          description: Unique identifier for the technology
          example: 1
        technology:
          type: string
          description: Name of the technology
          example: "Unity"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PartialTechnology:
      type: object
      properties:
        technology:
          type: string
          description: Name of the technology
          example: "Unity"

    Tracker:
      type: object
      properties:
        tracker_id:
          type: integer
          description: Unique identifier for the tracker
          example: 1
        tracker:
          type: string
          description: Name of the tracker
          example: "unity_tracker"
        technology_id:
          type: integer
          description: ID of the associated technology
          example: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PartialTracker:
      type: object
      properties:
        tracker:
          type: string
          description: Name of the tracker
          example: "unity_tracker"
        technology_id:
          type: integer
          description: ID of the associated technology
          example: 1

    Language:
      type: object
      properties:
        language_id:
          type: integer
          description: Unique identifier for the language
          example: 1
        language:
          type: string
          description: Name of the language
          example: "English"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PartialLanguage:
      type: object
      properties:
        language:
          type: string
          description: Name of the language
          example: "Spanish"

    TeacherGuide:
      type: object
      properties:
        guide_id:
          type: integer
          description: Unique identifier for the teacher guide
          example: 1
        game_id:
          type: integer
          description: ID of the associated game
          example: 1
        language_id:
          type: integer
          description: ID of the associated language
          example: 1
        url:
          type: string
          format: uri
          description: URL to the teacher guide resource
          example: "https://example.com/guides/math-game-guide"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PartialTeacherGuide:
      type: object
      properties:
        game_id:
          type: integer
          description: ID of the associated game
          example: 1
        language_id:
          type: integer
          description: ID of the associated language
          example: 1
        url:
          type: string
          format: uri
          description: URL to the teacher guide resource
          example: "https://example.com/guides/math-game-guide"

    GuidePermission:
      type: object
      properties:
        game_id:
          type: integer
          example: 1
        language_id:
          type: integer
          example: 1
        permissions:
          type: string
          example: "read"
        user_id:
          type: integer
          example: 1

    Error:
      type: object
      properties:
        message:
          type: string
          description: Error message
          example: "Resource not found"
        code:
          type: string
          description: Error code
          example: "NOT_FOUND"
        timestamp:
          type: string
          format: date-time
          description: When the error occurred

    CompleteGamePermission:
      type: object
      description: Complete game permission record with aggregated data from games, permissions, users, technologies, and trackers
      properties:
        user_id:
          type: integer
          description: ID of the user with permission
          example: 123
        username:
          type: string
          description: Username of the user
          example: "john_doe"
        role:
          type: string
          description: Role of the user
          example: "TEACHER"
        email:
          type: string
          description: Email of the user
          example: "john@example.com"
        permission:
          type: string
          description: Permission type
          enum: ["READ", "WRITE"]
          example: "READ"
        game_id:
          type: integer
          description: ID of the game
          example: 456
        name:
          type: string
          description: Name of the game
          example: "Educational Game"
        public:
          type: boolean
          description: Whether the game is public
          example: true
        description:
          type: string
          description: Game description
          example: "An educational game for learning math"
        owner_id:
          type: integer
          description: ID of the game owner
          example: 789
        type:
          type: string
          description: Game type
          enum: ["WEB", "DESKTOP"]
          example: "WEB"
        actual_version_id:
          type: integer
          description: ID of the current version
          example: 1
        actual_version_url:
          type: string
          description: URL of the current version
          example: "https://game.example.com/v1"
        technology_name:
          type: string
          description: Name of the technology used
          example: "Unity"
        tracker_name:
          type: string
          description: Name of the tracker used
          example: "Analytics Tracker"
        createdAt:
          type: string
          format: date-time
          description: Record creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Record update timestamp

    CompleteGameGuidePermission:
      type: object
      description: Complete game guide permission record with aggregated data from games, guides, languages, and permissions
      properties:
        user_id:
          type: integer
          description: ID of the user with permission
          example: 123
        username:
          type: string
          description: Username of the user
          example: "john_doe"
        role:
          type: string
          description: Role of the user
          example: "TEACHER"
        email:
          type: string
          description: Email of the user
          example: "john@example.com"
        permission:
          type: string
          description: Permission type
          enum: ["READ", "WRITE"]
          example: "READ"
        game_id:
          type: integer
          description: ID of the game
          example: 456
        language:
          type: string
          description: Language of the teacher guide
          example: "en"
        teacher_guide_url:
          type: string
          description: URL of the teacher guide
          example: "https://guides.example.com/game456/en"
        createdAt:
          type: string
          format: date-time
          description: Record creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Record update timestamp

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Resource not found"
            code: "NOT_FOUND"

    BadRequest:
      description: Bad request - invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Invalid input provided"
            code: "BAD_REQUEST"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Internal server error"
            code: "INTERNAL_ERROR"

tags:
  - name: Admins
