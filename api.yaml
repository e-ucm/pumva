  - name: Healths
    description: Health check operations (no authentication required)
  - name: Views_databases
    description: Database view operations for complex data aggregations (read-only)
  - name: Games_table_databases
    description: Game table management operations
  - name: Users_table_databases
    description: User table management operations
  - name: Teacher_Guides_table_databases
    description: Teacher guide table management operations
  - name: Game_Version_table_databases
    description: Game version table management operations
  - name: Game_Permissions_table_databases
    description: Game permission table management operations
  - name: Technologies_table_databases
    description: Technology table management operations
  - name: Trackers_table_databases
    description: Tracker table management operations
  - name: Languages_table_databases
    description: Language table management operations